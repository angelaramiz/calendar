services:
  - type: static_site
    name: calendarfinance-web
    runtime: static
    buildCommand: bash build.sh
    staticPublishPath: ./dist
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SCRAPER_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
